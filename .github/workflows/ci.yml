name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Compile check
        run: python -m compileall app

      - name: Run tests
        run: |
          set +e
          pytest -q -p no:cacheprovider > /tmp/pytest.out 2>&1
          rc=$?
          cat /tmp/pytest.out
          if [ $rc -ne 0 ]; then
            msg=$(grep -v -i "warn" /tmp/pytest.out | tail -c 1500 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=pytest exit $rc::$msg"
          fi
          exit $rc

      - name: Lint (ruff)
        run: ruff check .
