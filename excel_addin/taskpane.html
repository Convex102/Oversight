<!doctype html>
<html>
  <head>
    <meta charset="utf-8"/>
    <title>ASGL‑A Runner</title>
    <link rel="stylesheet" href="servination.css">
  </head>
  <body class="addin">
    <div class="card">
      <h3>ASGL‑A Runner</h3>
      <p class="muted" style="line-height:1.6">
        Upload a workbook/PDF pack, run ASGL‑A in the cloud, and download the report. This add‑in uses API keys and never stores your files outside
        your tenant storage.
      </p>

      <label class="kicker">API Base URL</label>
      <input id="base" placeholder="https://asgl.yourdomain.com" class="input"/>

      <label class="kicker" style="margin-top:10px">API key</label>
      <input id="api" placeholder="X-API-Key or Bearer &lt;key&gt;" class="input"/>

      <div class="btnrow" style="margin-top:10px">
        <button id="btnSave" class="btn primary" type="button">Save</button>
        <button id="btnClear" class="btn" type="button">Clear</button>
      </div>

      <label class="kicker" style="margin-top:12px">Upload files</label>
      <input id="file" type="file" multiple class="input" accept=".xlsx,.xlsm,.xls,.pdf,.csv"/>

      <div class="btnrow" style="margin-top:10px;flex-wrap:wrap">
        <button id="btnRun" class="btn primary" type="button">Run ASGL‑A</button>
        <button id="btnDownload" class="btn" type="button" disabled>Download report</button>
      </div>

      <pre id="out" style="margin-top:10px;max-height:320px;overflow:auto"></pre>
    </div>

    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script src="taskpane.js"></script>
  </body>
</html>
